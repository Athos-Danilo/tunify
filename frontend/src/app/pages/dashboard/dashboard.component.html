<main class="dashboard" [ngClass]="{'tema-claro': !modoEscuro}">

  <canvas #radarCanvas class="radar-canvas"></canvas>

  <div class="dashboard-content">
    <app-header 
      [nomeUsuario]="nomeUsuario" 
      [fotoPerfil]="dadosDemograficos.foto_perfil"
      [modoEscuro]="modoEscuro"
      (onAlternarTema)="alternarTema()"
      (onLogout)="fazerLogout()">
    </app-header>

    <div class="dashboard-grid">

      <div class="profile-column">
        <app-card-perfil
          [nomeUsuario]="nomeUsuario"
          [dadosDemograficos]="dadosDemograficos"
          [modoEscuro]="modoEscuro"
          [ultimaMusica]="ultimaMusica"
          [minutosOuvidosHoje]="minutosOuvidosHoje">
        </app-card-perfil>

        <!-- Acesso compacto ao círculo musical -->
        <app-sync-card
          *ngIf="emailUsuario"
          [email]="emailUsuario"
          [modoEscuro]="modoEscuro">
        </app-sync-card>
      </div>

      <app-top-musicas></app-top-musicas>

      <app-minutes-listened 
        [totalMinutos]="minutosTotais"
        [variacao]="variacaoMinutos">
      </app-minutes-listened>

      <app-top-artistas *ngIf="emailUsuario" [email]="emailUsuario"></app-top-artistas>

    </div>

  </div>

  <app-player-container></app-player-container>

</main>

<main class="estatisticas-container" [ngClass]="{'tema-claro': !modoEscuro}">
  
  <div class="header-wrapper">
    <app-header 
      [nomeUsuario]="nomeUsuario" 
      [fotoPerfil]="fotoPerfil"
      [modoEscuro]="modoEscuro"
      (onAlternarTema)="alternarTema()"
      (onLogout)="fazerLogout()">
    </app-header>
  </div>

  <div class="conteudo-central">
    <div class="titulo-pagina-container">
      <h1 class="titulo-especial">Estatísticas do Seu Tunify</h1>
      <p class="subtitulo-pagina">Explore seu histórico de reproduções e os rankings das suas músicas preferidas.</p>
    </div>

    <!-- PAINEL DE GAVETAS (ACCORDION) -->
    <div class="painel-gavetas">
      
      <!-- GAVETA 1: HISTÓRICO RECENTE -->
      <div class="gaveta-item" [ngClass]="{'aberta': gavetaHistoricoAberta}">
        <button class="gaveta-header" (click)="alternarGavetaHistorico()">
          <div class="gaveta-info">
            <div class="icone-badge azul">
              <span class="material-icons">history</span>
            </div>
            <div class="gaveta-textos">
              <h2 class="gaveta-titulo">Histórico Recente</h2>
              <span class="gaveta-resumo">As últimas faixas tocadas em tempo real</span>
            </div>
          </div>
          <div class="gaveta-acoes">
            <span class="badge-status verde">Ao Vivo</span>
            <span class="material-icons chevron-icone">{{ gavetaHistoricoAberta ? 'expand_less' : 'expand_more' }}</span>
          </div>
        </button>

        <div class="gaveta-corpo" *ngIf="gavetaHistoricoAberta">
          <app-reproducoes-recentes></app-reproducoes-recentes>
        </div>
      </div>

      <!-- GAVETA 2: TOP 10 MÚSICAS MENSAIS -->
      <div class="gaveta-item" [ngClass]="{'aberta': gavetaTopMusicasAberta}">
        <button class="gaveta-header" (click)="alternarGavetaTopMusicas()">
          <div class="gaveta-info">
            <div class="icone-badge dourado">
              <span class="material-icons">workspace_premium</span>
            </div>
            <div class="gaveta-textos">
              <h2 class="gaveta-titulo">Top Músicas Mensais</h2>
              <span class="gaveta-resumo">Ranking das 10 faixas mais ouvidas no mês</span>
            </div>
          </div>
          <div class="gaveta-acoes">
            <span class="badge-status dourado">Top 10</span>
            <span class="material-icons chevron-icone">{{ gavetaTopMusicasAberta ? 'expand_less' : 'expand_more' }}</span>
          </div>
        </button>

        <div class="gaveta-corpo" *ngIf="gavetaTopMusicasAberta">
          <app-top-musicas-mensais></app-top-musicas-mensais>
        </div>
      </div>

      <!-- GAVETA 3: TOP 15 ARTISTAS MENSAIS -->
      <div class="gaveta-item" [ngClass]="{'aberta': gavetaTopArtistasAberta}">
        <button class="gaveta-header" (click)="alternarGavetaTopArtistas()">
          <div class="gaveta-info">
            <div class="icone-badge verde">
              <span class="material-icons">star</span>
            </div>
            <div class="gaveta-textos">
              <h2 class="gaveta-titulo">Top Artistas Mensais</h2>
              <span class="gaveta-resumo">Ranking dos 15 artistas que você mais escutou</span>
            </div>
          </div>
          <div class="gaveta-acoes">
            <span class="badge-status verde">Top 15</span>
            <span class="material-icons chevron-icone">{{ gavetaTopArtistasAberta ? 'expand_less' : 'expand_more' }}</span>
          </div>
        </button>

        <div class="gaveta-corpo" *ngIf="gavetaTopArtistasAberta">
          <app-top-artistas-mensais></app-top-artistas-mensais>
        </div>
      </div>

      <!-- GAVETA 4: GRÁFICO DE MINUTOS OUVIDOS -->
      <div class="gaveta-item" [ngClass]="{'aberta': gavetaTopMinutosAberta}">
        <button class="gaveta-header" (click)="alternarGavetaTopMinutos()">
          <div class="gaveta-info">
            <div class="icone-badge cinza">
              <span class="material-icons">bar_chart</span>
            </div>
            <div class="gaveta-textos">
              <h2 class="gaveta-titulo">Gráfico de Imersão</h2>
              <span class="gaveta-resumo">Evolução do tempo que você passa ouvindo música</span>
            </div>
          </div>
          <div class="gaveta-acoes">
            <span class="badge-status cinza">Gráfico</span>
            <span class="material-icons chevron-icone">{{ gavetaTopMinutosAberta ? 'expand_less' : 'expand_more' }}</span>
          </div>
        </button>

        <div class="gaveta-corpo" *ngIf="gavetaTopMinutosAberta">
          <app-graficos-minutos-meses></app-graficos-minutos-meses>
        </div>
      </div>

    </div>
  </div>

</main>
